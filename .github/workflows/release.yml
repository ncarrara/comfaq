name: release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - run: uv sync --locked

      - run: mkdir dist

      - run: uv run comfaq pdf dist/comfaq.pdf

      - run: uv run comfaq csv dist/comfaq.csv

      - name: publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest || gh release create latest --title "Latest" --notes ""
          gh release edit latest --notes "Built from ${GITHUB_SHA}"
          gh release upload latest dist/comfaq.pdf dist/comfaq.csv --clobber

      - name: publish dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: dist
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: Built from ${{ github.sha }}
