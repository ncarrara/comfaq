name: release

on:
  push:
    branches-ignore: ['dist', 'dist-**']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: |
          BRANCH_SLUG=$(printf %s "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9_-' '-')
          echo "DIST_BRANCH=dist-$BRANCH_SLUG" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_NAME" = main ]; then echo "SHEET=comfaq" >> "$GITHUB_ENV"; else echo "SHEET=comfaq-$BRANCH_SLUG" >> "$GITHUB_ENV"; fi

      - uses: astral-sh/setup-uv@v6

      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - run: uv sync --locked

      - run: mkdir dist

      - run: uv run comfaq pdf dist/comfaq.pdf --branch "$GITHUB_REF_NAME"

      - run: uv run comfaq csv dist/comfaq.csv

      - run: uv run comfaq changelog dist/changes.json --limit 30

      - run: uv run comfaq history dist/history.json

      - name: publish latest release
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest || gh release create latest --title "Latest" --notes ""
          gh release edit latest --notes "Built from ${GITHUB_SHA}"
          gh release upload latest dist/comfaq.pdf dist/comfaq.csv dist/changes.json dist/history.json --clobber

      - name: publish dist branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_branch: ${{ env.DIST_BRANCH }}
          publish_dir: ./dist
          force_orphan: true
          full_commit_message: Built from ${{ github.sha }}

      - name: notify discord
        if: github.ref_name == 'main' || github.ref_name == 'test_faq'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          BEFORE: ${{ github.event.before }}
        run: >-
          uv run comfaq discord
          --before "$BEFORE"
          --after "$GITHUB_SHA"
          --branch "$GITHUB_REF_NAME"
          --sheet "$SHEET"
          --repo "$GITHUB_REPOSITORY"
          --site-url https://warhammaking.com
