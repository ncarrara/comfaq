name: pdf

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pdf
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - run: sudo apt-get update && sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0

      - run: uv sync --locked

      - run: uv run comfaq pdf comfaq.pdf

      - name: publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f latest
          git push -f origin latest
          gh release view latest || gh release create latest --title "Latest" --notes ""
          gh release edit latest --notes "Built from ${GITHUB_SHA}"
          gh release upload latest comfaq.pdf --clobber
